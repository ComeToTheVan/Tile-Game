<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Game</title>
    <link rel="stylesheet" href="./style.css">

    <script type="importmap">
      {
        "imports": {
          "socket.io-client": "/socket-assets/socket.io.esm.min.js"
        }
      }
    </script>

    <script type="module">
      import { clientGame } from "./client.js" 
      window.scrollTo(0, 0)

      if (document.cookie === "") {
        document.cookie = Math.random().toString(36).substring(1,20).toUpperCase()+";max-age="+60*60*10
      }
        
      console.log(document.cookie)

      window.addEventListener("DOMContentLoaded", () => {
        const client = new clientGame()

        document.getElementById("createButton").addEventListener("click", function() { client.createRoom() })
        document.getElementById("joinButton").addEventListener("click", function() { client.joinRoom(document.getElementById("roomId").value) })
        document.getElementById("closeButton").addEventListener("click", function() { client.endOverlayNoMore() })
      })
    </script>

  </head>
  <body style="overflow: hidden">
    <div id="begining" class="box">
      <h1>Tile Game</h1>
      <h2>It's a game, about tiles</h2>
      <div id="makeRoom" class="roomDiv roomMakeDiv">
        <label>Width: </label>
        <input type="text" id="xAmount" size="5px" value="10">
        <br>
        <br>
        <label>Height:</label>
        <input type="text" id="yAmount" size="5px" value="10">
        <br>
        <br>
        <label>Players:</label> 
        <input type="text" id="pAmount" size="2px" value="2">
        <br>
        <br>
        <button id="createButton" class="roomButton">Create Room</button>
      </div>
      <br> 
      <div id="joinRoom" class="roomDiv roomJoinDiv">
        <label>Room Id: </label>
        <input type="text" id="roomId" size="5px" value="">
        <br>
        <button id="joinButton" class="roomButton">Join Room</button>
      </div>
    </div>
    <div id="game">
      <p class="roomText" id="roomIdDisplay">Room Id: </p>
      <p class="roomText" id="turnDisplay">Turn: </p>
      <p class="roomText" id="playerDisplay">You are: </p>
    </div>
    <div id="endOverlay">
      <div class="endOverlay"></div>
      <div class="box" style="z-index: 11; top: -12.5%;">
        <h1>The Winner Is...</h1>
        <br><br><br>
        <h1 id="winnerDisplay" style="color: rgb(209, 209, 36);">Noone</h1>
        <br><br><br><br><br><br>
        <button id="closeButton">Close</button>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Game</title>
    <script type="importmap">
      {
        "imports": {
          "socket.io-client": "/socket-assets/socket.io.esm.min.js"
        }
      }
    </script>


    <script type="module">
      import { clientGame } from "./client.js" 

      window.addEventListener("DOMContentLoaded", () => {
        const client = new clientGame()

        let startButton = document.createElement('button')
        startButton.innerHTML = "Create Room"
        startButton.addEventListener("click", function() { client.Start() })
        document.getElementById('begining').appendChild(startButton)
      });
    </script>

    <style>
      .tile {
        position: absolute;
        width: 50px;
        height: 50px;
        border-width: 1px;
        border-style: solid;
        border-color: black;
      }
    </style>
  </head>
  <body>
    <div id="begining">
      <div>
        <label>X amount: </label>
        <input type="text" id="xAmount" size="5px" value="10">
        <br>
        <label>Y amount:</label>
        <input type="text" id="yAmount" size="5px" value="10">
        <br>
        <label>Players:</label> 
        <input type="text" id="pAmount" size="2px" value="2">
        <label>Player:</label>
        <input type="text" id="p" size="1px" value="1">
        <br>
      </div>
      
    </div>
    <div id="tiles">
    </div>
  </body>
</html>
